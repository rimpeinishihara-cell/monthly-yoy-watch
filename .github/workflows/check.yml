name: Monthly YoY Watch

# GitHub Actions の schedule トリガーは実行が不安定(遅延・スキップ)なため、
# 外部の cron-job.org から workflow_dispatch を毎日8:00 JSTに呼び出す運用にしている。
# (README参照)
on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD, 省略時は当日)"
        required: false
      dry_run:
        description: "Discordに送らずログのみ出力する"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-yoy-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/check_monthly.py $ARGS

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/notified.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update notified state [skip ci]"
            git push
          else
            echo "No state change"
          fi
